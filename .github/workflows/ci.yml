name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main] # main deploys via Vercel; no need to double-run here

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  lint-and-types:
    name: Biome + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm run check:ci

      - name: Typecheck
        run: pnpm run typecheck

  build:
    name: Next build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: embedclub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway CI database — migrations run against it before the build.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/embedclub_ci
      PAYLOAD_SECRET: ci-not-a-real-secret
      # Local-disk uploads in CI (no S3 creds); mirrors a local prod build.
      USE_S3_STORAGE: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm run payload migrate

      - name: Build
        run: pnpm run build:app
